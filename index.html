<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Καταγραφέας Ορίζοντα PVGIS – v2 (ανθεκτική πυξίδα)</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #000;
      color: white;
      touch-action: manipulation;
    }
    #videoContainer {
      position: relative;
      width: 100vw; height: 100vh;
      overflow: hidden;
    }
    video {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    #crosshair {
      position: absolute; top: 50%; left: 50%;
      width: 70px; height: 70px;
      margin: -35px 0 0 -35px;
      border: 2px solid cyan;
      border-radius: 50%;
      box-shadow: 0 0 12px cyan;
      pointer-events: none;
    }
    #crosshair::after, #crosshair::before {
      content: '';
      position: absolute;
      background: cyan;
    }
    #crosshair::after { top: 50%; left: 0; right: 0; height: 1px; }
    #crosshair::before { top: 0; bottom: 0; left: 50%; width: 1px; }

    #horizonBar {
      position: absolute; top: 50%; left: 10%;
      width: 80%; height: 2px;
      background: rgba(255,255,255,0.8);
      transform-origin: center;
      pointer-events: none;
      box-shadow: 0 0 4px white;
      transition: transform 0.1s;
    }
    #levelIndicator {
      position: absolute; top: 45%; left: 50%;
      margin-left: -40px;
      font-size: 12px; color: white;
      background: rgba(0,0,0,0.6);
      padding: 2px 8px; border-radius: 8px;
      pointer-events: none;
    }

    #calibrationNotice {
      position: absolute; top: 35%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 140, 0, 0.9);
      color: black;
      padding: 12px 20px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 16px;
      text-align: center;
      display: none;
      z-index: 20;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.85; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.03); }
      100% { opacity: 0.85; transform: translate(-50%, -50%) scale(1); }
    }

    #hud {
      position: absolute; bottom: 130px; left: 20px;
      background: rgba(0,0,0,0.7);
      padding: 10px; border-radius: 12px;
      font-size: 14px; line-height: 1.5;
      pointer-events: none;
      z-index: 10;
    }
    #compassQuality {
      display: inline-block;
      width: 12px; height: 12px;
      border-radius: 50%;
      margin-left: 4px;
      background: gray;
    }
    #controls {
      position: absolute; bottom: 20px; left: 0; right: 0;
      display: flex; justify-content: center; gap: 10px;
      flex-wrap: wrap; padding: 0 10px;
      z-index: 10;
    }
    button {
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.5);
      color: white;
      padding: 14px 20px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 600;
    }
    button:active { background: rgba(255,255,255,0.5); }
    button:disabled {
      opacity: 0.4;
      background: rgba(255,255,255,0.1);
    }
    #recordList {
      position: absolute; top: 20px; right: 20px;
      background: rgba(0,0,0,0.7); padding: 8px;
      border-radius: 10px; font-size: 12px;
      max-height: 140px; overflow-y: auto;
      display: none; pointer-events: none;
      z-index: 10;
    }
    #chartCanvas {
      position: absolute; bottom: 160px; right: 10px;
      width: 120px; height: 120px;
      border-radius: 50%; background: rgba(0,0,0,0.5);
      border: 1px solid white;
      display: none;
    }
  </style>
</head>
<body>
  <div id="videoContainer">
    <video id="video" autoplay playsinline muted></video>
    <div id="horizonBar"></div>
    <div id="levelIndicator">🎚️ 0°</div>
    <div id="crosshair"></div>
    <div id="calibrationNotice">🧭 Χαμηλή ακρίβεια πυξίδας – κουνήστε σε σχήμα 8</div>

    <div id="hud">
      <div id="azimuthDisplay">Αζιμούθιο: --°</div>
      <div id="elevationDisplay">Ύψος: --°</div>
      <div id="pitchRollDisplay">Κλίση: --</div>
      <div id="qualityDisplay">Ποιότητα: <span id="compassQuality"></span> <span id="qualityText">--</span></div>
    </div>

    <div id="recordList"></div>
    <canvas id="chartCanvas" width="120" height="120"></canvas>

    <div id="controls">
      <button id="startBtn">▶️ Έναρξη</button>
      <button id="recordBtn" disabled>📍 Καταγραφή Σημείου</button>
      <button id="generateBtn" disabled>📁 Horizon File</button>
    </div>
  </div>

  <script>
    (function() {
      const video = document.getElementById('video');
      const azimuthEl = document.getElementById('azimuthDisplay');
      const elevationEl = document.getElementById('elevationDisplay');
      const pitchRollEl = document.getElementById('pitchRollDisplay');
      const qualityDot = document.getElementById('compassQuality');
      const qualityText = document.getElementById('qualityText');
      const calibrationNotice = document.getElementById('calibrationNotice');
      const recordListEl = document.getElementById('recordList');
      const startBtn = document.getElementById('startBtn');
      const recordBtn = document.getElementById('recordBtn');
      const generateBtn = document.getElementById('generateBtn');
      const chartCanvas = document.getElementById('chartCanvas');
      const ctx = chartCanvas.getContext('2d');
      const horizonBar = document.getElementById('horizonBar');
      const levelIndicator = document.getElementById('levelIndicator');

      let isListening = false;
      let currentAzimuth = null;
      let currentElevation = null;
      let recordedPoints = [];

      // Μετρικές σταθερότητας
      const ALPHA_HISTORY = 10;       // αριθμός δειγμάτων
      let alphaSamples = [];
      let quality = 'unknown';        // 'good', 'ok', 'poor'

      function toRad(deg) { return deg * Math.PI / 180; }

      // Υπολογισμός 3D κατεύθυνσης (ίδιος όπως πριν)
      function computeCameraDirection(alpha, beta, gamma) {
        const a = toRad(alpha);
        const b = toRad(beta);
        const c = toRad(gamma);
        const cosA = Math.cos(a), sinA = Math.sin(a);
        const cosB = Math.cos(b), sinB = Math.sin(b);
        const cosC = Math.cos(c), sinC = Math.sin(c);

        const m11 = cosA*cosC - sinA*sinB*sinC;
        const m12 = -sinA*cosB;
        const m13 = cosA*sinC + sinA*sinB*cosC;
        const m21 = sinA*cosC + cosA*sinB*sinC;
        const m22 = cosA*cosB;
        const m23 = sinA*sinC - cosA*sinB*cosC;
        const m31 = -cosB*sinC;
        const m32 = sinB;
        const m33 = cosB*cosC;

        const vx = -m13;
        const vy = -m23;
        const vz = -m33;
        const len = Math.sqrt(vx*vx+vy*vy+vz*vz);
        if (len < 1e-6) return { azimuth: 0, elevation: 0 };
        const nx = vx/len, ny = vy/len, nz = vz/len;
        let azimuth = Math.atan2(nx, ny) * 180/Math.PI;
        if (azimuth < 0) azimuth += 360;
        const elevation = Math.asin(nz) * 180/Math.PI;
        return { azimuth, elevation };
      }

      // Εκτίμηση ποιότητας πυξίδας από διασπορά alpha
      function evaluateQuality(newAlpha) {
        alphaSamples.push(newAlpha);
        if (alphaSamples.length > ALPHA_HISTORY) alphaSamples.shift();
        if (alphaSamples.length < 3) return 'unknown';

        let sum = 0, min = 360, max = 0;
        for (let v of alphaSamples) {
          sum += v;
          if (v < min) min = v;
          if (v > max) max = v;
        }
        const range = (max - min); // 0-360
        if (range < 2.0) return 'good';
        else if (range < 8.0) return 'ok';
        else return 'poor';
      }

      function updateQualityUI(qual) {
        let color, text;
        switch (qual) {
          case 'good': color = '#00ff88'; text = 'Άριστη'; break;
          case 'ok':   color = '#ffbb00'; text = 'Μέτρια'; break;
          case 'poor': color = '#ff4444'; text = 'Χαμηλή'; break;
          default:     color = 'gray';    text = '...';    break;
        }
        qualityDot.style.background = color;
        qualityText.textContent = text;
        if (qual === 'poor') {
          calibrationNotice.style.display = 'block';
        } else if (qual === 'good' || qual === 'ok') {
          calibrationNotice.style.display = 'none';
        }
      }

      // main event handler
      function handleOrientation(event) {
        if (!isListening) return;
        const alpha = event.alpha;
        const beta = event.beta;
        const gamma = event.gamma;

        if (alpha === null || beta === null || gamma === null) {
          recordBtn.disabled = true;
          return;
        }

        // Αξιολόγηση ποιότητας πυξίδας
        quality = evaluateQuality(alpha);
        updateQualityUI(quality);

        // Υπολογισμός πάντα (αγνοούμε το absolute)
        const { azimuth, elevation } = computeCameraDirection(alpha, beta, gamma);
        currentAzimuth = azimuth;
        currentElevation = elevation;

        azimuthEl.textContent = `Αζιμούθιο: ${azimuth.toFixed(1)}°`;
        elevationEl.textContent = `Ύψος: ${elevation.toFixed(1)}°`;
        pitchRollEl.textContent = `Κλίση: β=${beta.toFixed(1)}° γ=${gamma.toFixed(1)}°`;

        // Τεχνητός ορίζοντας
        horizonBar.style.transform = `rotate(${-gamma}deg)`;
        levelIndicator.textContent = `🎚️ ${Math.abs(gamma).toFixed(0)}°`;

        // Ενεργοποίηση καταγραφής αν έχουμε έστω κάποια τιμή (ο χρήστης αποφασίζει)
        recordBtn.disabled = false;
      }

      // --- Camera ---
      async function startCamera() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } },
            audio: false
          });
          video.srcObject = stream;
          return true;
        } catch (err) {
          alert('Σφάλμα κάμερας: ' + err.message);
          return false;
        }
      }

      // --- Sensors permission (iOS 13+) ---
      async function requestSensors() {
        if (typeof DeviceOrientationEvent !== 'undefined' &&
            typeof DeviceOrientationEvent.requestPermission === 'function') {
          try {
            const perm = await DeviceOrientationEvent.requestPermission();
            if (perm !== 'granted') {
              alert('Άρνηση πρόσβασης στους αισθητήρες.');
              return false;
            }
          } catch (err) {
            alert('Σφάλμα άδειας: ' + err.message);
            return false;
          }
        }
        return true;
      }

      // --- Καταγραφή ---
      function addRecordedPoint() {
        if (currentAzimuth === null || currentElevation === null) return;
        recordedPoints.push({ azimuth: currentAzimuth, elevation: currentElevation });
        updateRecordList();
        updateChart();
        generateBtn.disabled = recordedPoints.length < 2;
      }

      function updateRecordList() {
        if (recordedPoints.length === 0) {
          recordListEl.style.display = 'none';
          return;
        }
        recordListEl.style.display = 'block';
        recordListEl.innerHTML = '<strong>Σημεία:</strong><br>' +
          recordedPoints.map((p,i) => `${i+1}: ${p.azimuth.toFixed(0)}° / ${p.elevation.toFixed(1)}°`).join('<br>');
      }

      function updateChart() {
        if (recordedPoints.length < 2) {
          chartCanvas.style.display = 'none';
          return;
        }
        chartCanvas.style.display = 'block';
        const w = chartCanvas.width, h = chartCanvas.height;
        ctx.clearRect(0, 0, w, h);
        ctx.strokeStyle = 'cyan';
        ctx.lineWidth = 2;
        ctx.beginPath();
        const pts = [...recordedPoints].sort((a,b)=>a.azimuth-b.azimuth);
        const wrapped = pts.concat([{azimuth: pts[0].azimuth+360, elevation: pts[0].elevation}]);
        const cx=w/2, cy=h/2, r=50;
        for (let az=0; az<=360; az+=5) {
          let p1,p2;
          for (let i=0;i<wrapped.length-1;i++) {
            if (az>=wrapped[i].azimuth && az<=wrapped[i+1].azimuth) { p1=wrapped[i]; p2=wrapped[i+1]; break; }
          }
          if (!p1||!p2) continue;
          const t=(az-p1.azimuth)/(p2.azimuth-p1.azimuth);
          const elev=p1.elevation+t*(p2.elevation-p1.elevation);
          const ang=(az-90)*Math.PI/180;
          const rad=(90-elev)/90*r;
          const x=cx+rad*Math.cos(ang), y=cy+rad*Math.sin(ang);
          if (az===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        }
        ctx.stroke();
      }

      // --- Horizon file ---
      function generateHorizonFile() {
        if (recordedPoints.length<2) return;
        const pts=[...recordedPoints].sort((a,b)=>a.azimuth-b.azimuth);
        const wrapped=pts.concat([{azimuth:pts[0].azimuth+360,elevation:pts[0].elevation}]);
        const horizon=new Array(360).fill(0);
        for(let az=0;az<360;az++) {
          let p1,p2;
          for(let i=0;i<wrapped.length-1;i++) {
            if(az>=wrapped[i].azimuth&&az<=wrapped[i+1].azimuth){p1=wrapped[i];p2=wrapped[i+1];break;}
          }
          if(p1&&p2){const t=(az-p1.azimuth)/(p2.azimuth-p1.azimuth);horizon[az]=p1.elevation+t*(p2.elevation-p1.elevation);}
          else horizon[az]=0;
        }
        let content='# Horizon file for PVGIS\n# azimuth (0=North) elevation in degrees\n';
        content+=horizon.map(v=>v.toFixed(1)).join('\n')+'\n';
        const blob=new Blob([content],{type:'text/plain'});
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a');a.href=url;a.download='horizon_pvgis.txt';
        document.body.appendChild(a);a.click();
        document.body.removeChild(a);URL.revokeObjectURL(url);
      }

      // --- Init ---
      startBtn.addEventListener('click', async ()=>{
        startBtn.disabled=true;
        const sensOk=await requestSensors();
        if(!sensOk){startBtn.disabled=false;return;}
        const camOk=await startCamera();
        if(!camOk){startBtn.disabled=false;return;}
        isListening=true;
        startBtn.textContent='✅ Ενεργό';
        startBtn.style.background='rgba(0,255,0,0.3)';
        // το recordBtn ενεργοποιείται μόλις λάβουμε το πρώτο orientation event
      });

      recordBtn.addEventListener('click', addRecordedPoint);
      generateBtn.addEventListener('click', generateHorizonFile);

      window.addEventListener('deviceorientation', handleOrientation, true);
      // Αρχική κατάσταση: record disabled μέχρι να έχουμε δεδομένα
      recordBtn.disabled = true;
      generateBtn.disabled = true;
    })();
  </script>
</body>
</html>
