<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Καταγραφέας Ορίζοντα PVGIS – Live Αισθητήρες</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #000;
      color: white;
      touch-action: manipulation;
    }
    #videoContainer {
      position: relative;
      width: 100vw; height: 100vh;
      overflow: hidden;
    }
    video {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }

    /* Σταυρόνημα */
    #crosshair {
      position: absolute; top: 50%; left: 50%;
      width: 70px; height: 70px;
      margin: -35px 0 0 -35px;
      border: 2px solid cyan;
      border-radius: 50%;
      box-shadow: 0 0 12px cyan;
      pointer-events: none;
    }
    #crosshair::after, #crosshair::before {
      content: '';
      position: absolute;
      background: cyan;
    }
    #crosshair::after { top: 50%; left: 0; right: 0; height: 1px; }
    #crosshair::before { top: 0; bottom: 0; left: 50%; width: 1px; }

    /* Τεχνητός ορίζοντας */
    #horizonBar {
      position: absolute; top: 50%; left: 10%;
      width: 80%; height: 2px;
      background: rgba(255,255,255,0.8);
      transform-origin: center;
      pointer-events: none;
      box-shadow: 0 0 4px white;
      transition: transform 0.1s;
    }
    #levelIndicator {
      position: absolute; top: 45%; left: 50%;
      margin-left: -40px;
      font-size: 12px; color: white;
      background: rgba(0,0,0,0.6);
      padding: 2px 8px; border-radius: 8px;
      pointer-events: none;
    }

    /* Μήνυμα βαθμονόμησης */
    #calibrationNotice {
      position: absolute; top: 35%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 165, 0, 0.9);
      color: black;
      padding: 15px 25px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 18px;
      text-align: center;
      display: none;
      z-index: 20;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.9; }
      50% { opacity: 1; }
      100% { opacity: 0.9; }
    }

    /* HUD κύριων ενδείξεων */
    #hud {
      position: absolute; bottom: 130px; left: 20px;
      background: rgba(0,0,0,0.7);
      padding: 10px; border-radius: 12px;
      font-size: 14px; line-height: 1.4;
      pointer-events: none;
      z-index: 10;
    }

    /* Πάνελ αισθητήρων (debug) */
    #sensorPanel {
      position: absolute; top: 10px; left: 10px;
      background: rgba(0,0,0,0.8);
      color: #0f0;
      font-family: monospace;
      font-size: 11px;
      padding: 8px;
      border-radius: 8px;
      max-width: 160px;
      display: none;
      z-index: 15;
      pointer-events: auto;
    }
    #sensorPanel button {
      background: none;
      border: 1px solid #0f0;
      color: #0f0;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      margin-bottom: 4px;
      display: block;
    }

    #controls {
      position: absolute; bottom: 20px; left: 0; right: 0;
      display: flex; justify-content: center; gap: 10px;
      flex-wrap: wrap; padding: 0 10px;
      z-index: 10;
    }
    button {
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.5);
      color: white; padding: 14px 20px;
      border-radius: 30px; font-size: 16px; font-weight: 600;
    }
    button:active { background: rgba(255,255,255,0.5); }
    button:disabled {
      opacity: 0.4;
      background: rgba(255,255,255,0.1);
    }
    #recordList {
      position: absolute; top: 20px; right: 20px;
      background: rgba(0,0,0,0.7); padding: 8px;
      border-radius: 10px; font-size: 12px;
      max-height: 150px; overflow-y: auto;
      display: none; pointer-events: none;
      z-index: 10;
    }
    #chartCanvas {
      position: absolute; bottom: 160px; right: 10px;
      width: 120px; height: 120px;
      border-radius: 50%; background: rgba(0,0,0,0.5);
      border: 1px solid white; display: none;
    }
  </style>
</head>
<body>
  <div id="videoContainer">
    <video id="video" autoplay playsinline muted></video>
    <div id="horizonBar"></div>
    <div id="levelIndicator">🎚️ 0°</div>
    <div id="crosshair"></div>
    <div id="calibrationNotice">🧭 Βαθμονόμηση πυξίδας…<br><small>Κουνήστε το τηλέφωνο σε σχήμα 8</small></div>

    <!-- HUD -->
    <div id="hud">
      <div id="azimuthDisplay">Αζιμούθιο: --</div>
      <div id="elevationDisplay">Ύψος: --</div>
      <div id="pitchRollDisplay">Κλίση: --</div>
      <div id="compassStatus">Κατάσταση: 🟡 αναμονή</div>
    </div>

    <!-- Debug αισθητήρων -->
    <div id="sensorPanel">
      <button id="closeSensorPanel">✖ Κλείσιμο</button>
      <div id="rawAlpha">alpha: --</div>
      <div id="rawBeta">beta: --</div>
      <div id="rawGamma">gamma: --</div>
      <div id="rawAbsolute">absolute: --</div>
      <div id="accel">acc: --</div>
      <div id="gyro">gyro: --</div>
      <div id="gpsInfo">GPS: --</div>
      <div id="camStatus">Κάμερα: --</div>
    </div>

    <div id="recordList"></div>
    <canvas id="chartCanvas" width="120" height="120"></canvas>

    <div id="controls">
      <button id="startBtn">▶️ Έναρξη</button>
      <button id="recordBtn" disabled>📍 Καταγραφή Σημείου</button>
      <button id="generateBtn" disabled>📁 Horizon File</button>
      <button id="sensorToggle" style="font-size:14px;">📊 Αισθητήρες</button>
    </div>
  </div>

  <script>
    (function() {
      // ---------- DOM elements ----------
      const video = document.getElementById('video');
      const azimuthEl = document.getElementById('azimuthDisplay');
      const elevationEl = document.getElementById('elevationDisplay');
      const pitchRollEl = document.getElementById('pitchRollDisplay');
      const compassStatusEl = document.getElementById('compassStatus');
      const horizonBar = document.getElementById('horizonBar');
      const levelIndicator = document.getElementById('levelIndicator');
      const calibrationNotice = document.getElementById('calibrationNotice');
      const recordListEl = document.getElementById('recordList');
      const startBtn = document.getElementById('startBtn');
      const recordBtn = document.getElementById('recordBtn');
      const generateBtn = document.getElementById('generateBtn');
      const chartCanvas = document.getElementById('chartCanvas');
      const ctx = chartCanvas.getContext('2d');
      const sensorPanel = document.getElementById('sensorPanel');
      const sensorToggleBtn = document.getElementById('sensorToggle');
      const closeSensorPanelBtn = document.getElementById('closeSensorPanel');

      // Raw data display
      const rawAlphaEl = document.getElementById('rawAlpha');
      const rawBetaEl = document.getElementById('rawBeta');
      const rawGammaEl = document.getElementById('rawGamma');
      const rawAbsoluteEl = document.getElementById('rawAbsolute');
      const accelEl = document.getElementById('accel');
      const gyroEl = document.getElementById('gyro');
      const gpsInfoEl = document.getElementById('gpsInfo');
      const camStatusEl = document.getElementById('camStatus');

      // ---------- State ----------
      let currentAzimuth = null;
      let currentElevation = null;
      let isListening = false;
      let compassReady = false;  // true μόνο όταν έχουμε απόλυτο event
      let recordedPoints = [];
      let gpsCoordinates = null; // { lat, lon, accuracy }

      // ---------- Utilities ----------
      function toRad(deg) { return deg * Math.PI / 180; }

      // ---------- Compute camera direction from device orientation ----------
      function computeCameraDirection(alpha, beta, gamma) {
        const a = toRad(alpha);
        const b = toRad(beta);
        const c = toRad(gamma);
        const cosA = Math.cos(a), sinA = Math.sin(a);
        const cosB = Math.cos(b), sinB = Math.sin(b);
        const cosC = Math.cos(c), sinC = Math.sin(c);

        const m11 = cosA*cosC - sinA*sinB*sinC;
        const m12 = -sinA*cosB;
        const m13 = cosA*sinC + sinA*sinB*cosC;
        const m21 = sinA*cosC + cosA*sinB*sinC;
        const m22 = cosA*cosB;
        const m23 = sinA*sinC - cosA*sinB*cosC;
        const m31 = -cosB*sinC;
        const m32 = sinB;
        const m33 = cosB*cosC;

        const vx = -m13;
        const vy = -m23;
        const vz = -m33;
        const len = Math.sqrt(vx*vx + vy*vy + vz*vz);
        if (len < 1e-6) return { azimuth: 0, elevation: 0 };
        const nx = vx/len, ny = vy/len, nz = vz/len;
        let azimuth = Math.atan2(nx, ny) * 180/Math.PI;
        if (azimuth < 0) azimuth += 360;
        const elevation = Math.asin(nz) * 180/Math.PI;
        return { azimuth, elevation };
      }

      // ---------- Device Orientation Handler ----------
      function handleOrientation(event) {
        if (!isListening) return;

        const alpha = event.alpha;
        const beta = event.beta;
        const gamma = event.gamma;
        const absolute = event.absolute;

        // Ενημέρωση raw πάνελ
        rawAlphaEl.textContent = `alpha: ${alpha !== null ? alpha.toFixed(1) : 'null'}`;
        rawBetaEl.textContent = `beta: ${beta !== null ? beta.toFixed(1) : 'null'}`;
        rawGammaEl.textContent = `gamma: ${gamma !== null ? gamma.toFixed(1) : 'null'}`;
        rawAbsoluteEl.textContent = `absolute: ${absolute}`;

        if (alpha === null || beta === null || gamma === null) return;

        // Έλεγχος ετοιμότητας πυξίδας
        if (absolute === true) {
          compassReady = true;
          compassStatusEl.textContent = 'Κατάσταση: ✅ έτοιμο';
          compassStatusEl.style.color = 'lightgreen';
          calibrationNotice.style.display = 'none';
          recordBtn.disabled = false;
        } else {
          compassReady = false;
          compassStatusEl.textContent = 'Κατάσταση: 🧭 βαθμονόμηση...';
          compassStatusEl.style.color = 'orange';
          calibrationNotice.style.display = 'block';
          recordBtn.disabled = true;
          azimuthEl.textContent = 'Αζιμούθιο: (αναμονή)';
          return;
        }

        const { azimuth, elevation } = computeCameraDirection(alpha, beta, gamma);
        currentAzimuth = azimuth;
        currentElevation = elevation;

        azimuthEl.textContent = `Αζιμούθιο: ${azimuth.toFixed(1)}°`;
        elevationEl.textContent = `Ύψος: ${elevation.toFixed(1)}°`;
        pitchRollEl.textContent = `Κλίση (pitch/roll): ${beta.toFixed(1)}° / ${gamma.toFixed(1)}°`;

        // Τεχνητός ορίζοντας
        horizonBar.style.transform = `rotate(${-gamma}deg)`;
        levelIndicator.textContent = `🎚️ ${Math.abs(gamma).toFixed(0)}° roll`;
      }

      // ---------- Device Motion (accelerometer & gyro) ----------
      function handleMotion(event) {
        if (!isListening) return;
        const acc = event.accelerationIncludingGravity;
        const rot = event.rotationRate;
        if (acc) {
          accelEl.textContent = `acc: x${acc.x?.toFixed(1)} y${acc.y?.toFixed(1)} z${acc.z?.toFixed(1)}`;
        }
        if (rot) {
          gyroEl.textContent = `gyro: a${rot.alpha?.toFixed(2)} b${rot.beta?.toFixed(2)} g${rot.gamma?.toFixed(2)}`;
        }
      }

      // ---------- GPS ----------
      function startGPS() {
        if (!navigator.geolocation) {
          gpsInfoEl.textContent = 'GPS: μη διαθέσιμο';
          return;
        }
        navigator.geolocation.watchPosition(
          (pos) => {
            gpsCoordinates = {
              lat: pos.coords.latitude,
              lon: pos.coords.longitude,
              accuracy: pos.coords.accuracy
            };
            gpsInfoEl.textContent = `GPS: ${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)} (±${pos.coords.accuracy.toFixed(0)}m)`;
          },
          (err) => {
            gpsInfoEl.textContent = `GPS σφάλμα: ${err.message}`;
          },
          { enableHighAccuracy: true, maximumAge: 5000 }
        );
      }

      // ---------- Camera ----------
      async function startCamera() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: 'environment',
              width: { ideal: 1920 },
              height: { ideal: 1080 }
            },
            audio: false
          });
          video.srcObject = stream;
          camStatusEl.textContent = 'Κάμερα: ✅ ενεργή';
          return true;
        } catch (err) {
          camStatusEl.textContent = 'Κάμερα: ❌ σφάλμα';
          alert('Δεν μπορεί να ανοίξει η Wide κάμερα: ' + err.message);
          return false;
        }
      }

      // ---------- Sensor Permission (iOS 13+) ----------
      async function requestSensors() {
        if (typeof DeviceOrientationEvent !== 'undefined' &&
            typeof DeviceOrientationEvent.requestPermission === 'function') {
          try {
            const permission = await DeviceOrientationEvent.requestPermission();
            if (permission !== 'granted') {
              alert('Η πρόσβαση στους αισθητήρες απορρίφθηκε.');
              return false;
            }
          } catch (err) {
            alert('Σφάλμα αισθητήρων: ' + err.message);
            return false;
          }
        }
        return true;
      }

      // ---------- Καταγραφή σημείου ----------
      function addRecordedPoint() {
        if (!compassReady || currentAzimuth === null || currentElevation === null) {
          alert('Περιμένετε να ολοκληρωθεί η βαθμονόμηση της πυξίδας.');
          return;
        }
        recordedPoints.push({ azimuth: currentAzimuth, elevation: currentElevation });
        updateRecordList();
        updateChart();
        generateBtn.disabled = recordedPoints.length < 2;
      }

      function updateRecordList() {
        if (recordedPoints.length === 0) {
          recordListEl.style.display = 'none';
          return;
        }
        recordListEl.style.display = 'block';
        recordListEl.innerHTML = '<strong>Σημεία:</strong><br>' +
          recordedPoints.map((p, i) =>
            `${i+1}: ${p.azimuth.toFixed(0)}° / ${p.elevation.toFixed(1)}°`
          ).join('<br>');
      }

      function updateChart() {
        if (recordedPoints.length < 2) {
          chartCanvas.style.display = 'none';
          return;
        }
        chartCanvas.style.display = 'block';
        const w = chartCanvas.width, h = chartCanvas.height;
        ctx.clearRect(0, 0, w, h);
        ctx.strokeStyle = 'cyan';
        ctx.lineWidth = 2;
        ctx.beginPath();
        const pts = [...recordedPoints].sort((a,b) => a.azimuth - b.azimuth);
        const wrapped = pts.concat([{azimuth: pts[0].azimuth + 360, elevation: pts[0].elevation}]);
        const cx = w/2, cy = h/2, r = 50;
        for (let az = 0; az <= 360; az += 5) {
          let p1, p2;
          for (let i = 0; i < wrapped.length - 1; i++) {
            if (az >= wrapped[i].azimuth && az <= wrapped[i+1].azimuth) {
              p1 = wrapped[i]; p2 = wrapped[i+1]; break;
            }
          }
          if (!p1 || !p2) continue;
          const t = (az - p1.azimuth) / (p2.azimuth - p1.azimuth);
          const elev = p1.elevation + t * (p2.elevation - p1.elevation);
          const angleRad = (az - 90) * Math.PI / 180;
          const radius = (90 - elev) / 90 * r;
          const x = cx + radius * Math.cos(angleRad);
          const y = cy + radius * Math.sin(angleRad);
          if (az === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }

      // ---------- Δημιουργία horizon file ----------
      function generateHorizonFile() {
        if (recordedPoints.length < 2) return;
        const pts = [...recordedPoints].sort((a,b) => a.azimuth - b.azimuth);
        const wrapped = pts.concat([{azimuth: pts[0].azimuth + 360, elevation: pts[0].elevation}]);
        const horizon = new Array(360).fill(0);
        for (let az = 0; az < 360; az++) {
          let p1, p2;
          for (let i = 0; i < wrapped.length - 1; i++) {
            if (az >= wrapped[i].azimuth && az <= wrapped[i+1].azimuth) {
              p1 = wrapped[i]; p2 = wrapped[i+1]; break;
            }
          }
          if (p1 && p2) {
            const t = (az - p1.azimuth) / (p2.azimuth - p1.azimuth);
            horizon[az] = p1.elevation + t * (p2.elevation - p1.elevation);
          }
        }
        let content = `# Horizon file for PVGIS\n`;
        if (gpsCoordinates) {
          content += `# GPS: ${gpsCoordinates.lat.toFixed(6)}, ${gpsCoordinates.lon.toFixed(6)}\n`;
        }
        content += `# azimuth (0=North, clockwise) elevation in degrees\n`;
        content += horizon.map(v => v.toFixed(1)).join('\n') + '\n';

        const blob = new Blob([content], {type: 'text/plain'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'horizon_pvgis.txt';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      // ---------- Έναρξη ----------
      startBtn.addEventListener('click', async () => {
        startBtn.disabled = true;
        const sensorsOk = await requestSensors();
        if (!sensorsOk) { startBtn.disabled = false; return; }
        const cameraOk = await startCamera();
        if (!cameraOk) { startBtn.disabled = false; return; }
        isListening = true;
        startGPS();
        startBtn.textContent = '✅ Ενεργό';
        startBtn.style.background = 'rgba(0,255,0,0.3)';
        // το recordBtn παραμένει disabled μέχρι να έρθει absolute=true
      });

      recordBtn.addEventListener('click', addRecordedPoint);
      generateBtn.addEventListener('click', generateHorizonFile);

      // Sensor panel toggle
      sensorToggleBtn.addEventListener('click', () => {
        sensorPanel.style.display = sensorPanel.style.display === 'block' ? 'none' : 'block';
      });
      closeSensorPanelBtn.addEventListener('click', () => {
        sensorPanel.style.display = 'none';
      });

      // Καταχώριση listeners
      window.addEventListener('deviceorientation', handleOrientation, true);
      window.addEventListener('devicemotion', handleMotion, true);

      // Αρχική απενεργοποίηση κουμπιών (περιμένουν)
      recordBtn.disabled = true;
      generateBtn.disabled = true;
    })();
  </script>
</body>
</html>
