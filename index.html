<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>PVGIS Horizon Capture</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <style>
        * { margin:0; padding:0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; background: black; font-family: -apple-system, sans-serif; color: white; }
        #app { position: relative; width: 100%; height: 100%; }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        #overlay { position: absolute; top:0; left:0; width:100%; height:100%; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; }
        #horizon-line { position: absolute; top: 50%; left: 0; width: 100%; height: 1px; background: rgba(0,255,0,0.4); pointer-events: none; }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 60px; height: 60px; border: 2px dashed rgba(0,255,0,0.6); border-radius: 50%; pointer-events: none; }
        #info { background: rgba(0,0,0,0.6); padding: 8px; font-size: 18px; text-align: center; }
        #controls { background: rgba(0,0,0,0.6); padding: 12px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        button { padding: 10px 16px; font-size: 16px; border: none; border-radius: 6px; background: #007aff; color: white; }
        button:active { opacity: 0.8; }
        #point-list { max-height: 100px; overflow-y: auto; background: rgba(0,0,0,0.6); margin: 5px; padding: 5px; font-size: 14px; }
        .settings { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        input[type=number] { width: 60px; padding: 4px; font-size: 16px; }
        .hidden { display: none; }
        #compass-status { position: absolute; top: 10px; right: 10px; width: 12px; height: 12px; border-radius: 50%; background: red; }
        #compass-status.active { background: #00ff00; }
    </style>
</head>
<body>
    <div id="app">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas" class="hidden"></canvas>
        <div id="horizon-line"></div>
        <div id="crosshair"></div>
        <div id="compass-status"></div>
        <div id="overlay">
            <div id="info">🧭 Azimuth: <span id="az-value">---</span>° | 📐 Elevation: <span id="el-value">---</span>°</div>
            <div>
                <div id="point-list">Σημεία: (κανένα)</div>
                <div id="controls">
                    <button id="enable-compass-btn">Ενεργοποίηση Πυξίδας</button>
                    <button id="undo-btn">↩️ Ακύρωση τελευταίου</button>
                    <button id="clear-btn">🗑️ Καθαρισμός</button>
                    <button id="export-btn">💾 Δημιουργία αρχείου</button>
                    <div class="settings">
                        VFOV(°): <input type="number" id="vfov-input" value="72" step="1" min="30" max="90">
                        Back(°): <input type="number" id="back-horizon-input" value="90" step="1" min="0" max="90">
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        (function() {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const azSpan = document.getElementById('az-value');
            const elSpan = document.getElementById('el-value');
            const pointListDiv = document.getElementById('point-list');
            const enableCompassBtn = document.getElementById('enable-compass-btn');
            const undoBtn = document.getElementById('undo-btn');
            const clearBtn = document.getElementById('clear-btn');
            const exportBtn = document.getElementById('export-btn');
            const vfovInput = document.getElementById('vfov-input');
            const backHorizonInput = document.getElementById('back-horizon-input');
            const compassStatus = document.getElementById('compass-status');
            
            let points = [];
            let currentHeading = null;
            let currentElevation = null;
            let compassActive = false;
            
            // ---------- Κάμερα ----------
            async function startCamera() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'environment' },
                        audio: false
                    });
                    video.srcObject = stream;
                } catch (err) {
                    alert('Δεν ήταν δυνατή η πρόσβαση στην κάμερα: ' + err.message);
                }
            }
            
            // ---------- Πυξίδα ----------
            function enableCompass() {
                if (typeof DeviceOrientationEvent !== 'undefined') {
                    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                        DeviceOrientationEvent.requestPermission()
                        .then(response => {
                            if (response === 'granted') {
                                window.addEventListener('deviceorientation', handleOrientation, true);
                                compassActive = true;
                                enableCompassBtn.classList.add('hidden');
                                compassStatus.classList.add('active');
                                video.addEventListener('touchstart', onVideoTouch);
                                video.addEventListener('click', onVideoClick);
                            } else {
                                alert('Δεν επιτράπηκε η πυξίδα.');
                            }
                        })
                        .catch(console.error);
                    } else {
                        window.addEventListener('deviceorientation', handleOrientation, true);
                        compassActive = true;
                        enableCompassBtn.classList.add('hidden');
                        compassStatus.classList.add('active');
                        video.addEventListener('touchstart', onVideoTouch);
                        video.addEventListener('click', onVideoClick);
                    }
                } else {
                    alert('Ο browser δεν υποστηρίζει προσανατολισμό συσκευής.');
                }
            }
            
            function handleOrientation(event) {
                let heading;
                if (event.webkitCompassHeading) {
                    heading = event.webkitCompassHeading;
                } else if (event.absolute && event.alpha !== null) {
                    heading = 360 - event.alpha;
                    if (heading < 0) heading += 360;
                } else {
                    return;
                }
                currentHeading = heading;
                // Εμφάνιση ως PVGIS στο HUD
                azSpan.textContent = geoPvgis(heading).toFixed(1);
            }

            // Μετατροπή γεωγραφικού (0-360, 0=Β) → PVGIS (-180/+180, 0=Ν)
            function geoPvgis(geo) {
                let pvgis = geo - 180;
                if (pvgis > 180) pvgis -= 360;
                if (pvgis < -180) pvgis += 360;
                return pvgis;
            }
            
            // ---------- Αφή στην εικόνα ----------
            function getElevationFromTouch(clientY) {
                const rect = video.getBoundingClientRect();
                const y = clientY - rect.top;
                const centerY = rect.height / 2;
                const delta = centerY - y;
                const vfov = parseFloat(vfovInput.value) || 72;
                const maxAngle = vfov / 2;
                let elevation = (delta / centerY) * maxAngle;
                elevation = Math.max(-90, Math.min(90, elevation));
                return elevation;
            }
            
            function onVideoTouch(e) {
                e.preventDefault();
                if (!compassActive || currentHeading === null) return;
                const touch = e.touches[0];
                if (!touch) return;
                const elevation = getElevationFromTouch(touch.clientY);
                // Αποθήκευση σε γεωγραφικό (0-360) — μετατροπή γίνεται στην εξαγωγή
                points.push({ azimuth: currentHeading, elevation });
                currentElevation = elevation;
                elSpan.textContent = elevation.toFixed(1);
                updatePointList();
            }
            
            function onVideoClick(e) {
                if (!compassActive || currentHeading === null) return;
                const elevation = getElevationFromTouch(e.clientY);
                points.push({ azimuth: currentHeading, elevation });
                currentElevation = elevation;
                elSpan.textContent = elevation.toFixed(1);
                updatePointList();
            }
            
            // ---------- Διαχείριση σημείων ----------
            function updatePointList() {
                if (points.length === 0) {
                    pointListDiv.textContent = 'Σημεία: (κανένα)';
                } else {
                    const last = points.slice(-5);
                    // Εμφάνιση ως PVGIS
                    pointListDiv.innerHTML = 'Σημεία: ' + last.map(p =>
                        `${geoPvgis(p.azimuth).toFixed(1)}°/${p.elevation.toFixed(1)}°`
                    ).join(', ');
                    if (points.length > 5) pointListDiv.innerHTML += ' …';
                }
            }
            
            undoBtn.addEventListener('click', () => {
                if (points.length > 0) {
                    points.pop();
                    updatePointList();
                }
            });
            
            clearBtn.addEventListener('click', () => {
                points = [];
                updatePointList();
            });
            
            // ---------- Εξαγωγή ----------
            function exportHorizonFile() {
                if (points.length < 2) {
                    alert('Χρειαζονται τουλάχιστον 2 σημεία για παρεμβολή.');
                    return;
                }
                const backHorizon = parseFloat(backHorizonInput.value) || 90;

                // Μετατροπή σε PVGIS (-180..+180) για παρεμβολή
                const pvgisPoints = points.map(p => ({
                    azimuth: geoPvgis(p.azimuth),
                    elevation: p.elevation
                })).sort((a, b) => a.azimuth - b.azimuth);

                // Παρεμβολή σε -180..+179 (360 τιμές) με PVGIS αζιμούθια
                let horizon = new Array(360).fill(backHorizon);
                const minAz = pvgisPoints[0].azimuth;
                const maxAz = pvgisPoints[pvgisPoints.length - 1].azimuth;

                for (let i = 0; i < 360; i++) {
                    const deg = i - 180; // -180 έως +179
                    if (deg >= minAz && deg <= maxAz) {
                        let prev = pvgisPoints[0];
                        let next = pvgisPoints[pvgisPoints.length - 1];
                        for (let j = 0; j < pvgisPoints.length - 1; j++) {
                            if (pvgisPoints[j].azimuth <= deg && pvgisPoints[j+1].azimuth >= deg) {
                                prev = pvgisPoints[j];
                                next = pvgisPoints[j+1];
                                break;
                            }
                        }
                        const range = next.azimuth - prev.azimuth;
                        const t = range === 0 ? 0 : (deg - prev.azimuth) / range;
                        horizon[i] = prev.elevation + t * (next.elevation - prev.elevation);
                    }
                }

                // Εξαγωγή: μία τιμή ανά γραμμή, από -180° έως +179°
                let content = '# Horizon file for PVGIS\n';
                content += '# Generated by PVGIS Horizon Capture\n';
                content += '# Format: one elevation value per line, azimuth -180 to +179 (PVGIS, 0=South)\n';
                content += `# Back horizon: ${backHorizon} deg\n`;
                for (let i = 0; i < 360; i++) {
                    content += horizon[i].toFixed(2) + '\n';
                }

                const blob = new Blob([content], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'horizon_PVGIS.txt';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
            
            exportBtn.addEventListener('click', exportHorizonFile);
            enableCompassBtn.addEventListener('click', enableCompass);
            enableCompassBtn.addEventListener('pointerdown', enableCompass);
            startCamera();
        })();
    </script>
</body>
</html>
