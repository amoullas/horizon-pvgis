<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Καταγραφέας Ορίζοντα PVGIS – PVGIS‑συμβατό αζιμούθιο</title>
  <style>
    body {
      margin: 0; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #000; color: white;
      touch-action: manipulation;
    }
    #videoContainer {
      position: relative; width: 100vw; height: 100vh; overflow: hidden;
    }
    video {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; object-fit: cover;
    }
    #crosshair {
      position: absolute; top: 50%; left: 50%;
      width: 70px; height: 70px; margin: -35px 0 0 -35px;
      border: 2px solid cyan; border-radius: 50%;
      box-shadow: 0 0 12px cyan; pointer-events: none;
    }
    #crosshair::after, #crosshair::before {
      content: ''; position: absolute; background: cyan;
    }
    #crosshair::after { top: 50%; left: 0; right: 0; height: 1px; }
    #crosshair::before { top: 0; bottom: 0; left: 50%; width: 1px; }
    #horizonBar {
      position: absolute; top: 50%; left: 10%; width: 80%; height: 2px;
      background: rgba(255,255,255,0.8); transform-origin: center;
      pointer-events: none; box-shadow: 0 0 4px white;
      transition: transform 0.1s;
    }
    #levelIndicator {
      position: absolute; top: 45%; left: 50%; margin-left: -40px;
      font-size: 12px; color: white; background: rgba(0,0,0,0.6);
      padding: 2px 8px; border-radius: 8px; pointer-events: none;
    }
    #calibrationNotice {
      position: absolute; top: 35%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 140, 0, 0.9); color: black;
      padding: 12px 20px; border-radius: 20px; font-weight: bold;
      font-size: 16px; text-align: center; display: none; z-index: 20;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.85; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.03); }
      100% { opacity: 0.85; transform: translate(-50%, -50%) scale(1); }
    }
    #liveSensorPanel {
      position: absolute; top: 10px; left: 10px;
      background: rgba(0,0,0,0.75); color: #0f0;
      font-family: monospace; font-size: 11px; padding: 10px;
      border-radius: 10px; max-width: 200px; z-index: 15;
      line-height: 1.5; pointer-events: none;
      border: 1px solid rgba(255,255,255,0.3);
    }
    #liveSensorPanel .label { color: #aaa; }
    #liveSensorPanel .value { color: #0f0; font-weight: bold; }
    #hud {
      position: absolute; bottom: 130px; left: 20px;
      background: rgba(0,0,0,0.7); padding: 10px; border-radius: 12px;
      font-size: 14px; line-height: 1.5; pointer-events: none; z-index: 10;
    }
    #compassQuality {
      display: inline-block; width: 12px; height: 12px;
      border-radius: 50%; background: gray; margin-left: 4px;
    }
    #controls {
      position: absolute; bottom: 20px; left: 0; right: 0;
      display: flex; justify-content: center; gap: 10px;
      flex-wrap: wrap; padding: 0 10px; z-index: 10;
    }
    button {
      background: rgba(255,255,255,0.2); backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.5); color: white;
      padding: 14px 20px; border-radius: 30px;
      font-size: 16px; font-weight: 600;
    }
    button:active { background: rgba(255,255,255,0.5); }
    button:disabled { opacity: 0.4; background: rgba(255,255,255,0.1); }
    #recordList {
      position: absolute; top: 20px; right: 20px;
      background: rgba(0,0,0,0.7); padding: 8px;
      border-radius: 10px; font-size: 12px;
      max-height: 140px; overflow-y: auto;
      display: none; pointer-events: none; z-index: 10;
    }
    #chartCanvas {
      position: absolute; bottom: 160px; right: 10px;
      width: 120px; height: 120px; border-radius: 50%;
      background: rgba(0,0,0,0.5); border: 1px solid white;
      display: none;
    }
    #downloadBtn, #shareBtn { display: none; }
  </style>
</head>
<body>
  <div id="videoContainer">
    <video id="video" autoplay playsinline muted></video>
    <div id="horizonBar"></div>
    <div id="levelIndicator">🎚️ 0°</div>
    <div id="crosshair"></div>
    <div id="calibrationNotice">🧭 Χαμηλή ακρίβεια – κουνήστε σε σχήμα 8</div>

    <div id="liveSensorPanel">
      <div><span class="label">🧭 Alpha (iPhone):</span> <span id="sAlpha" class="value">--</span></div>
      <div><span class="label">🧭 PVGIS Az:</span> <span id="sPvgisAz" class="value">--</span></div>
      <div><span class="label">📐 Beta:</span> <span id="sBeta" class="value">--</span></div>
      <div><span class="label">🔄 Gamma:</span> <span id="sGamma" class="value">--</span></div>
      <div><span class="label">📍 Absolute:</span> <span id="sAbsolute" class="value">--</span></div>
      <div><span class="label">📳 Accel:</span> <span id="sAccel" class="value">--</span></div>
      <div><span class="label">🌀 Gyro:</span> <span id="sGyro" class="value">--</span></div>
      <div><span class="label">🌍 GPS:</span> <span id="sGPS" class="value">--</span></div>
      <div><span class="label">🎥 Κάμερα:</span> <span id="sCamera" class="value">--</span></div>
      <div><span class="label">⭐ Ποιότητα:</span> <span id="sQuality" class="value">--</span></div>
    </div>

    <div id="hud">
      <div id="azimuthDisplay">Αζιμούθιο (PVGIS): --°</div>
      <div id="elevationDisplay">Ύψος: --°</div>
      <div id="pitchRollDisplay">Κλίση: --</div>
      <div id="qualityDisplay">Ποιότητα: <span id="compassQuality"></span> <span id="qualityText">--</span></div>
    </div>

    <div id="recordList"></div>
    <canvas id="chartCanvas" width="120" height="120"></canvas>

    <div id="controls">
      <button id="startBtn">▶️ Έναρξη</button>
      <button id="recordBtn" disabled>📍 Καταγραφή Σημείου</button>
      <button id="generateBtn" disabled>📁 Δημιουργία Horizon File</button>
      <button id="downloadBtn">💾 Λήψη</button>
      <button id="shareBtn">📤 Κοινοποίηση</button>
    </div>
  </div>

  <script>
    (function() {
      const video = document.getElementById('video');
      const azimuthEl = document.getElementById('azimuthDisplay');
      const elevationEl = document.getElementById('elevationDisplay');
      const pitchRollEl = document.getElementById('pitchRollDisplay');
      const qualityDot = document.getElementById('compassQuality');
      const qualityText = document.getElementById('qualityText');
      const calibrationNotice = document.getElementById('calibrationNotice');
      const recordListEl = document.getElementById('recordList');
      const startBtn = document.getElementById('startBtn');
      const recordBtn = document.getElementById('recordBtn');
      const generateBtn = document.getElementById('generateBtn');
      const downloadBtn = document.getElementById('downloadBtn');
      const shareBtn = document.getElementById('shareBtn');
      const chartCanvas = document.getElementById('chartCanvas');
      const ctx = chartCanvas.getContext('2d');
      const horizonBar = document.getElementById('horizonBar');
      const levelIndicator = document.getElementById('levelIndicator');

      const sAlpha = document.getElementById('sAlpha');
      const sPvgisAz = document.getElementById('sPvgisAz');
      const sBeta = document.getElementById('sBeta');
      const sGamma = document.getElementById('sGamma');
      const sAbsolute = document.getElementById('sAbsolute');
      const sAccel = document.getElementById('sAccel');
      const sGyro = document.getElementById('sGyro');
      const sGPS = document.getElementById('sGPS');
      const sCamera = document.getElementById('sCamera');
      const sQuality = document.getElementById('sQuality');

      let isListening = false;
      let currentAzimuth = null;   // iPhone αζιμούθιο (0=Βορράς)
      let currentElevation = null;
      let recordedPoints = [];      // { azimuth: iphoneAz, elevation }
      let horizonBlob = null;

      const ALPHA_HISTORY = 10;
      let alphaSamples = [];
      let quality = 'unknown';

      function toRad(deg) { return deg * Math.PI / 180; }

      function computeCameraDirection(alpha, beta, gamma) {
        const a = toRad(alpha), b = toRad(beta), c = toRad(gamma);
        const cosA = Math.cos(a), sinA = Math.sin(a);
        const cosB = Math.cos(b), sinB = Math.sin(b);
        const cosC = Math.cos(c), sinC = Math.sin(c);

        const m11 = cosA*cosC - sinA*sinB*sinC;
        const m12 = -sinA*cosB;
        const m13 = cosA*sinC + sinA*sinB*cosC;
        const m21 = sinA*cosC + cosA*sinB*sinC;
        const m22 = cosA*cosB;
        const m23 = sinA*sinC - cosA*sinB*cosC;
        const m31 = -cosB*sinC;
        const m32 = sinB;
        const m33 = cosB*cosC;

        const vx = -m13, vy = -m23, vz = -m33;
        const len = Math.sqrt(vx*vx+vy*vy+vz*vz);
        if (len < 1e-6) return { azimuth: 0, elevation: 0 };
        const nx = vx/len, ny = vy/len, nz = vz/len;
        let iphoneAz = Math.atan2(nx, ny) * 180/Math.PI; // 0=North, 90=East
        if (iphoneAz < 0) iphoneAz += 360;
        const elevation = Math.asin(nz) * 180/Math.PI;
        return { iphoneAz, elevation };
      }

      function iphoneAzToPvgis(iphoneAz) {
        return ((iphoneAz - 180 + 360) % 360) - 180; // εύρος -180..180
      }

      function evaluateQuality(newAlpha) {
        alphaSamples.push(newAlpha);
        if (alphaSamples.length > ALPHA_HISTORY) alphaSamples.shift();
        if (alphaSamples.length < 3) return 'unknown';
        let min = 360, max = 0;
        for (let v of alphaSamples) {
          if (v < min) min = v;
          if (v > max) max = v;
        }
        const range = max - min;
        if (range < 2.0) return 'good';
        else if (range < 8.0) return 'ok';
        else return 'poor';
      }

      function updateQualityUI(qual) {
        let color, text;
        switch (qual) {
          case 'good': color = '#00ff88'; text = 'Άριστη'; break;
          case 'ok':   color = '#ffbb00'; text = 'Μέτρια'; break;
          case 'poor': color = '#ff4444'; text = 'Χαμηλή'; break;
          default:     color = 'gray';    text = '...';    break;
        }
        qualityDot.style.background = color;
        qualityText.textContent = text;
        sQuality.textContent = text;
        sQuality.style.color = color;
        calibrationNotice.style.display = (qual === 'poor') ? 'block' : 'none';
      }

      function handleOrientation(event) {
        if (!isListening) return;
        const alpha = event.alpha, beta = event.beta, gamma = event.gamma;
        const absolute = event.absolute;

        sAlpha.textContent = alpha !== null ? alpha.toFixed(1) : 'null';
        sBeta.textContent = beta !== null ? beta.toFixed(1) : 'null';
        sGamma.textContent = gamma !== null ? gamma.toFixed(1) : 'null';
        sAbsolute.textContent = absolute ? '✅' : '❌';

        if (alpha === null || beta === null || gamma === null) {
          recordBtn.disabled = true;
          return;
        }

        quality = evaluateQuality(alpha);
        updateQualityUI(quality);

        const { iphoneAz, elevation } = computeCameraDirection(alpha, beta, gamma);
        currentAzimuth = iphoneAz; // αποθηκεύουμε ως iPhone
        currentElevation = elevation;

        const pvgisAz = iphoneAzToPvgis(iphoneAz);
        sPvgisAz.textContent = pvgisAz.toFixed(1) + '°';

        azimuthEl.textContent = `Αζιμούθιο (PVGIS): ${pvgisAz.toFixed(1)}°`;
        elevationEl.textContent = `Ύψος: ${elevation.toFixed(1)}°`;
        pitchRollEl.textContent = `Κλίση: β=${beta.toFixed(1)}° γ=${gamma.toFixed(1)}°`;

        horizonBar.style.transform = `rotate(${-gamma}deg)`;
        levelIndicator.textContent = `🎚️ ${Math.abs(gamma).toFixed(0)}°`;

        recordBtn.disabled = false;
      }

      function handleMotion(event) {
        if (!isListening) return;
        const acc = event.accelerationIncludingGravity;
        const rot = event.rotationRate;
        if (acc) sAccel.textContent = `x${acc.x?.toFixed(1)} y${acc.y?.toFixed(1)} z${acc.z?.toFixed(1)}`;
        if (rot) sGyro.textContent = `α${rot.alpha?.toFixed(2)} β${rot.beta?.toFixed(2)} γ${rot.gamma?.toFixed(2)}`;
      }

      function startGPS() {
        if (!navigator.geolocation) { sGPS.textContent = 'μη διαθέσιμο'; return; }
        navigator.geolocation.watchPosition(
          (pos) => sGPS.textContent = `${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)}`,
          () => sGPS.textContent = 'σφάλμα',
          { enableHighAccuracy: true, maximumAge: 5000 }
        );
      }

      async function startCamera() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } },
            audio: false
          });
          video.srcObject = stream;
          sCamera.textContent = '✅ Wide';
          return true;
        } catch (err) {
          sCamera.textContent = '❌ σφάλμα';
          alert('Σφάλμα κάμερας: ' + err.message);
          return false;
        }
      }

      async function requestSensors() {
        if (typeof DeviceOrientationEvent !== 'undefined' &&
            typeof DeviceOrientationEvent.requestPermission === 'function') {
          try {
            if ((await DeviceOrientationEvent.requestPermission()) !== 'granted')
              throw new Error('Άρνηση');
          } catch (err) {
            alert('Άρνηση πρόσβασης στους αισθητήρες.');
            return false;
          }
        }
        return true;
      }

      function addRecordedPoint() {
        if (currentAzimuth === null || currentElevation === null) return;
        recordedPoints.push({ azimuth: currentAzimuth, elevation: currentElevation }); // iPhone αζιμούθιο
        updateRecordList();
        updateChart();
        generateBtn.disabled = recordedPoints.length < 2;
        downloadBtn.style.display = 'none';
        shareBtn.style.display = 'none';
      }

      function updateRecordList() {
        recordListEl.style.display = recordedPoints.length ? 'block' : 'none';
        recordListEl.innerHTML = recordedPoints.length
          ? '<strong>Σημεία:</strong><br>' + recordedPoints.map((p,i) => {
              const pvgis = iphoneAzToPvgis(p.azimuth);
              return `${i+1}: ${pvgis.toFixed(0)}° / ${p.elevation.toFixed(1)}°`;
            }).join('<br>')
          : '';
      }

      function updateChart() {
        if (recordedPoints.length < 2) { chartCanvas.style.display = 'none'; return; }
        chartCanvas.style.display = 'block';
        const w = chartCanvas.width, h = chartCanvas.height;
        ctx.clearRect(0, 0, w, h);
        ctx.strokeStyle = 'cyan'; ctx.lineWidth = 2; ctx.beginPath();

        const pts = [...recordedPoints].sort((a,b)=>a.azimuth-b.azimuth);
        const wrapped = pts.concat([{azimuth: pts[0].azimuth+360, elevation: pts[0].elevation}]);
        const cx=w/2, cy=h/2, r=50;

        for (let az = 0; az <= 360; az += 5) {
          let p1, p2;
          for (let i=0; i<wrapped.length-1; i++) {
            if (az >= wrapped[i].azimuth && az <= wrapped[i+1].azimuth) {
              p1 = wrapped[i]; p2 = wrapped[i+1]; break;
            }
          }
          if (!p1||!p2) continue;
          const t = (az - p1.azimuth) / (p2.azimuth - p1.azimuth);
          const elev = p1.elevation + t * (p2.elevation - p1.elevation);
          const plotAz = az; // iPhone αζιμούθιο
          const angleRad = (plotAz - 90) * Math.PI/180; // 0° πάνω (North)
          const radius = (90 - elev) / 90 * r;
          const x = cx + radius * Math.cos(angleRad);
          const y = cy + radius * Math.sin(angleRad);
          if (az===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        }
        ctx.stroke();
      }

      function createHorizonFile() {
        if (recordedPoints.length < 2) return;

        const pts = [...recordedPoints].sort((a,b)=>a.azimuth-b.azimuth);
        const wrapped = pts.concat([{azimuth: pts[0].azimuth+360, elevation: pts[0].elevation}]);
        const horizon = new Array(360).fill(0);

        // Δημιουργία profile για PVGIS αζιμούθιο (0=South, 1..359)
        for (let pvgisAz = 0; pvgisAz < 360; pvgisAz++) {
          // αντιστοιχία: pvgisAz 0 (South) -> iPhone az 180
          const iphoneAz = (pvgisAz + 180) % 360;
          let p1, p2;
          for (let i=0; i<wrapped.length-1; i++) {
            if (iphoneAz >= wrapped[i].azimuth && iphoneAz <= wrapped[i+1].azimuth) {
              p1 = wrapped[i]; p2 = wrapped[i+1]; break;
            }
          }
          if (!p1 || !p2) {
            horizon[pvgisAz] = 0;
            continue;
          }
          const t = (iphoneAz - p1.azimuth) / (p2.azimuth - p1.azimuth);
          horizon[pvgisAz] = p1.elevation + t * (p2.elevation - p1.elevation);
        }

        let content = '# Horizon file for PVGIS\n';
        content += '# azimuth (0=South, positive West, negative East) elevation in degrees\n';
        content += horizon.map(v => v.toFixed(1)).join('\n') + '\n';

        horizonBlob = new Blob([content], {type: 'text/plain'});
        downloadBtn.style.display = 'inline-block';
        if (navigator.share && navigator.canShare &&
            navigator.canShare({ files: [new File([horizonBlob], 'horizon_pvgis.txt', { type: 'text/plain' })] })) {
          shareBtn.style.display = 'inline-block';
        } else {
          shareBtn.style.display = 'none';
        }
      }

      function downloadFile() {
        if (!horizonBlob) return;
        const url = URL.createObjectURL(horizonBlob);
        const a = document.createElement('a');
        a.href = url; a.download = 'horizon_pvgis.txt';
        document.body.appendChild(a); a.click();
        document.body.removeChild(a); URL.revokeObjectURL(url);
      }

      async function shareFile() {
        if (!horizonBlob) return;
        const file = new File([horizonBlob], 'horizon_pvgis.txt', { type: 'text/plain' });
        try {
          await navigator.share({ files: [file], title: 'Horizon File PVGIS', text: 'Αρχείο ορίζοντα για PVGIS' });
        } catch (err) {
          if (err.name !== 'AbortError') alert('Σφάλμα κοινοποίησης: ' + err.message);
        }
      }

      startBtn.addEventListener('click', async ()=>{
        startBtn.disabled = true;
        if (!await requestSensors()) { startBtn.disabled = false; return; }
        if (!await startCamera()) { startBtn.disabled = false; return; }
        isListening = true;
        startGPS();
        startBtn.textContent = '✅ Ενεργό';
        startBtn.style.background = 'rgba(0,255,0,0.3)';
      });

      recordBtn.addEventListener('click', addRecordedPoint);
      generateBtn.addEventListener('click', createHorizonFile);
      downloadBtn.addEventListener('click', downloadFile);
      shareBtn.addEventListener('click', shareFile);

      window.addEventListener('deviceorientation', handleOrientation, true);
      window.addEventListener('devicemotion', handleMotion, true);
    })();
  </script>
</body>
</html>
