<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>PVGIS Horizon Capture</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="data:application/json, {}">
    <style>
        * { margin:0; padding:0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; background: black; font-family: -apple-system, sans-serif; color: white; }
        #app { position: relative; width: 100%; height: 100%; }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
        #overlay { position: absolute; top:0; left:0; width:100%; height:100%; display: flex; flex-direction: column; justify-content: space-between; z-index: 10; pointer-events: none; }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 60px; height: 60px; border: 2px dashed rgba(0,255,0,0.6); border-radius: 50%; pointer-events: none; z-index: 5; }
        #horizon-line { position: absolute; top: 50%; left: 0; width: 100%; height: 1px; background: rgba(0,255,0,0.4); pointer-events: none; z-index: 5; }
        #compass-status { position: absolute; top: 10px; right: 10px; width: 14px; height: 14px; border-radius: 50%; background: red; z-index: 20; }
        #compass-status.active { background: #00ff00; }
        #info { background: rgba(0,0,0,0.7); padding: 10px; font-size: 20px; text-align: center; font-weight: 500; z-index: 10; pointer-events: none; }
        .controls-container { pointer-events: auto; }
        #point-list { max-height: 80px; overflow-y: auto; background: rgba(0,0,0,0.6); margin: 5px 5px 0 5px; padding: 8px; font-size: 14px; z-index: 10; pointer-events: auto; }
        #controls { background: rgba(0,0,0,0.7); padding: 16px 10px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; z-index: 10; pointer-events: auto; }
        button { padding: 14px 20px; font-size: 18px; border: none; border-radius: 12px; background: #007aff; color: white; font-weight: 600; cursor: pointer; min-height: 48px; min-width: 80px; transition: opacity 0.1s; z-index: 10; }
        button:active { opacity: 0.7; }
        .settings { display: flex; gap: 6px; align-items: center; font-size: 16px; background: rgba(255,255,255,0.1); padding: 6px 10px; border-radius: 8px; }
        input[type=number] { width: 65px; padding: 6px; font-size: 16px; border-radius: 6px; border: none; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div id="app">
        <video id="video" autoplay playsinline></video>
        <div id="horizon-line"></div>
        <div id="crosshair"></div>
        <div id="compass-status"></div>
        <div id="overlay">
            <div id="info">🧭 Azimuth: <span id="az-value">---</span>° | 📐 Elevation: <span id="el-value">---</span>°</div>
            <div class="controls-container">
                <div id="point-list">Σημεία: (κανένα)</div>
                <div id="controls">
                    <button id="enable-compass-btn">🧭 Ενεργοποίηση Πυξίδας</button>
                    <button id="undo-btn">↩️ Ακύρωση</button>
                    <button id="clear-btn">🗑️ Καθαρισμός</button>
                    <button id="export-btn">💾 Αποθήκευση</button>
                    <button id="share-btn">📤 Αποστολή</button>
                    <div class="settings">
                        <span>VFOV:</span>
                        <input type="number" id="vfov-input" value="72" step="1" min="30" max="90"><span>°</span>
                        <span>Back:</span>
                        <input type="number" id="back-horizon-input" value="90" step="1" min="0" max="90"><span>°</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        (function() {
            const video = document.getElementById('video');
            const azSpan = document.getElementById('az-value');
            const elSpan = document.getElementById('el-value');
            const pointListDiv = document.getElementById('point-list');
            const enableCompassBtn = document.getElementById('enable-compass-btn');
            const undoBtn = document.getElementById('undo-btn');
            const clearBtn = document.getElementById('clear-btn');
            const exportBtn = document.getElementById('export-btn');
            const shareBtn = document.getElementById('share-btn');
            const vfovInput = document.getElementById('vfov-input');
            const backHorizonInput = document.getElementById('back-horizon-input');
            const compassStatus = document.getElementById('compass-status');
            const appDiv = document.getElementById('app');
            
            let points = [];
            let currentHeading = null;
            let compassActive = false;
            
            // ---------- Κάμερα ----------
            async function startCamera() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'environment' },
                        audio: false
                    });
                    video.srcObject = stream;
                } catch (err) {
                    alert('Δεν ήταν δυνατή η πρόσβαση στην κάμερα: ' + err.message);
                }
            }
            
            // ---------- Πυξίδα ----------
            function handleOrientation(event) {
                let heading = null;
                if (event.webkitCompassHeading !== undefined) {
                    heading = event.webkitCompassHeading;
                } else if (event.absolute && event.alpha !== null) {
                    heading = 360 - event.alpha;
                    if (heading < 0) heading += 360;
                }
                if (heading !== null) {
                    currentHeading = heading;
                    azSpan.textContent = currentHeading.toFixed(1);
                }
            }
            
            function requestCompassPermission() {
                if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission()
                        .then(permissionState => {
                            if (permissionState === 'granted') {
                                window.addEventListener('deviceorientation', handleOrientation, true);
                                window.addEventListener('deviceorientationabsolute', handleOrientation, true);
                                enableCompassFeatures();
                            } else {
                                alert('Η πυξίδα δεν επιτράπηκε. Ενεργοποίησε την από Ρυθμίσεις > Safari > Γυροσκόπιο & Κίνηση.');
                            }
                        })
                        .catch(err => alert('Σφάλμα άδειας πυξίδας: ' + err.message));
                } else {
                    window.addEventListener('deviceorientation', handleOrientation, true);
                    window.addEventListener('deviceorientationabsolute', handleOrientation, true);
                    enableCompassFeatures();
                }
            }
            
            function enableCompassFeatures() {
                compassActive = true;
                enableCompassBtn.classList.add('hidden');
                compassStatus.classList.add('active');
            }
            
            // ---------- Υπολογισμός ανύψωσης ----------
            function getElevationFromTouch(clientY) {
                const rect = video.getBoundingClientRect();
                const y = clientY - rect.top;
                const centerY = rect.height / 2;
                const delta = centerY - y;
                const vfov = parseFloat(vfovInput.value) || 72;
                const maxAngle = vfov / 2;
                let elevation = (delta / centerY) * maxAngle;
                elevation = Math.max(-90, Math.min(90, elevation));
                return elevation;
            }
            
            // ---------- Χειρισμός αγγίγματος ----------
            function onScreenTap(e) {
                if (!compassActive || currentHeading === null) return;
                
                let clientY;
                if (e.touches && e.touches.length > 0) {
                    clientY = e.touches[0].clientY;
                } else if (e.clientY !== undefined) {
                    clientY = e.clientY;
                } else {
                    return;
                }
                
                const elevation = getElevationFromTouch(clientY);
                points.push({ azimuth: currentHeading, elevation });
                elSpan.textContent = elevation.toFixed(1);
                updatePointList();
                
                const line = document.getElementById('horizon-line');
                line.style.background = 'rgba(0,255,0,0.9)';
                setTimeout(() => { line.style.background = 'rgba(0,255,0,0.4)'; }, 200);
            }
            
            appDiv.addEventListener('touchstart', (e) => {
                const target = e.target;
                if (target.tagName === 'BUTTON' || target.tagName === 'INPUT') return;
                e.preventDefault();
                onScreenTap(e);
            });
            
            appDiv.addEventListener('click', (e) => {
                const target = e.target;
                if (target.tagName === 'BUTTON' || target.tagName === 'INPUT') return;
                onScreenTap(e);
            });
            
            // ---------- Διαχείριση σημείων ----------
            function updatePointList() {
                if (points.length === 0) {
                    pointListDiv.textContent = 'Σημεία: (κανένα)';
                } else {
                    const last = points.slice(-5);
                    pointListDiv.innerHTML = 'Σημεία: ' + last.map(p => `${p.azimuth.toFixed(1)}°/${p.elevation.toFixed(1)}°`).join(', ');
                    if (points.length > 5) pointListDiv.innerHTML += ' …';
                }
            }
            
            undoBtn.addEventListener('click', () => {
                if (points.length > 0) {
                    points.pop();
                    updatePointList();
                }
            });
            
            clearBtn.addEventListener('click', () => {
                points = [];
                updatePointList();
            });
            
            // ---------- Δημιουργία του αρχείου (επιστρέφει Blob και όνομα) ----------
            function generateHorizonBlob() {
                if (points.length < 2) {
                    alert('Χρειάζονται τουλάχιστον 2 σημεία για παρεμβολή.');
                    return null;
                }
                const backHorizon = parseFloat(backHorizonInput.value) || 90;
                let horizon = new Array(360).fill(backHorizon);
                const sorted = [...points].sort((a, b) => a.azimuth - b.azimuth);
                const minAz = sorted[0].azimuth;
                const maxAz = sorted[sorted.length-1].azimuth;
                
                for (let deg = 0; deg < 360; deg++) {
                    const azi = deg;
                    if (azi >= minAz && azi <= maxAz) {
                        let prev = sorted[0];
                        let next = sorted[sorted.length-1];
                        for (let i = 0; i < sorted.length-1; i++) {
                            if (sorted[i].azimuth <= azi && sorted[i+1].azimuth >= azi) {
                                prev = sorted[i];
                                next = sorted[i+1];
                                break;
                            }
                        }
                        const range = next.azimuth - prev.azimuth;
                        let t = range === 0 ? 0 : (azi - prev.azimuth) / range;
                        horizon[deg] = prev.elevation + t * (next.elevation - prev.elevation);
                    }
                }
                
                let content = '# Horizon file for PVGIS\n';
                content += '# Generated by Horizon PWA\n';
                content += `# Back horizon: ${backHorizon} deg\n`;
                for (let i = 0; i < 360; i++) {
                    content += horizon[i].toFixed(2) + '\n';
                }
                return new Blob([content], { type: 'text/plain' });
            }
            
            // ---------- Αποθήκευση (Download) ----------
            function downloadHorizonFile() {
                const blob = generateHorizonBlob();
                if (!blob) return;
                
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'horizon_PVGIS.txt';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
            
            // ---------- Αποστολή (Share Sheet) ----------
            async function shareHorizonFile() {
                const blob = generateHorizonBlob();
                if (!blob) return;
                
                const file = new File([blob], 'horizon_PVGIS.txt', { type: 'text/plain' });
                
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({
                            title: 'Αρχείο Ορίζοντα PVGIS',
                            text: 'Επισυνάπτεται το αρχείο ορίζοντα για το PVGIS.',
                            files: [file]
                        });
                    } catch (err) {
                        if (err.name !== 'AbortError') {
                            alert('Σφάλμα κοινοποίησης: ' + err.message);
                        }
                    }
                } else {
                    // Fallback: άνοιγμα σε νέα καρτέλα ή download
                    alert('Η συσκευή δεν υποστηρίζει άμεση αποστολή αρχείου. Θα γίνει λήψη του αρχείου.');
                    downloadHorizonFile();
                }
            }
            
            exportBtn.addEventListener('click', downloadHorizonFile);
            shareBtn.addEventListener('click', shareHorizonFile);
            
            // ---------- Εκκίνηση ----------
            enableCompassBtn.addEventListener('click', requestCompassPermission);
            startCamera();
        })();
    </script>
</body>
</html>
